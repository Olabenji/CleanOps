<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Mock driver licence for New Driver">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="55%" stop-color="#1b5e45"/>
      <stop offset="100%" stop-color="#0b2a20"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c5d5c8"/>
      <stop offset="100%" stop-color="#f4d35e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="22" fill="url(#bg)"/>
  <rect x="18" y="18" width="604" height="364" rx="16" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <rect x="18" y="18" width="604" height="64" rx="16" fill="url(#band)"/>
  <rect x="18" y="50" width="604" height="32" fill="url(#band)"/>
  <text x="36" y="58" fill="#102a20" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">CLEANOPS PILOT · DRIVER LICENCE</text>
  <text x="520" y="58" fill="#102a20" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">MOCK</text>
  <rect x="40" y="110" width="150" height="190" rx="10" fill="#d9ebe2"/>
  <circle cx="115" cy="175" r="42" fill="#7fa894"/>
  <rect x="73" y="225" width="84" height="55" rx="28" fill="#7fa894"/>
  <text x="115" y="320" fill="#1b4332" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">PHOTO</text>
  <text x="220" y="140" fill="#e8fff4" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1">FULL NAME</text>
  <text x="220" y="172" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">New Driver</text>
  <text x="220" y="214" fill="#e8fff4" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1">LICENCE NO.</text>
  <text x="220" y="242" fill="#ffffff" font-family="Consolas, monospace" font-size="22">LAG-DL-PENDING</text>
  <text x="220" y="284" fill="#e8fff4" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1">CLASS · PSP FLEET</text>
  <text x="220" y="312" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18">C · Waste collection</text>
  <text x="220" y="350" fill="#e8fff4" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1">EXPIRES</text>
  <text x="300" y="350" fill="#ffe08a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Set in Admin</text>
  <text x="40" y="368" fill="rgba(255,255,255,0.55)" font-family="Segoe UI, Arial, sans-serif" font-size="11">For CleanOps pilot demo only — not a government document</text>
