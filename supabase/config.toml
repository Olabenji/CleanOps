project_id = "cleanops"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Supabase CLI 2.98.2 rejects local Postgres 16 here. Use 15 locally until
# the CLI is upgraded; hosted Supabase can still target Postgres 16.
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true

[inbucket]
enabled = true
port = 54324

[functions.staff-auth]
verify_jwt = true

[functions.paystack-webhook]
verify_jwt = false

[functions.resident-paystack-checkout]
verify_jwt = true

[functions.resident-paystack-verify]
verify_jwt = true

[functions.dispatch-resident-notifications]
verify_jwt = false

[functions.dispatch-resident-comms]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false

[functions.phone-otp]
verify_jwt = false

[storage]
enabled = true
